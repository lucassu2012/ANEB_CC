<!-- @dsCard group="屏幕 Screens" name="结果 · 亮色" subtitle="跟随系统深浅色" width="360" height="720" -->
<link rel="stylesheet" href="../tokens.css">
<div class="wrap" style="padding:24px;display:flex;justify-content:center">
<div class="framewrap">
  <div class="phone lightapp"><div class="screen">
    <div class="notch"></div>
    <div class="chrome-top">
      <div class="sbar"><span>09:14</span><span class="net"><span>WiFi</span><span class="sig" style="color:var(--good)"><i></i><i></i><i></i><i></i></span></span></div>
      <div class="brandrow"><div class="wordmark"><div class="w">测试结果</div><div class="sub">WiFi · 家 · 刚刚</div></div>
        <div class="modeseg"><span class="on press">简洁</span><span class="press">专业</span></div></div>
    </div>

    <div class="appbody" style="padding-top:108px;padding-bottom:96px">
      <div class="gauge" data-gauge="78" color="var(--good)" style="margin-top:4px;color:var(--aink)">
        <svg width="208" height="208" viewBox="0 0 212 212" aria-hidden="true">
          <circle cx="106" cy="106" r="92" fill="none" stroke="var(--ahair)" stroke-width="4"/>
          <circle class="arc" cx="106" cy="106" r="92" fill="none" stroke="var(--good)" stroke-width="10" stroke-linecap="round" stroke-dasharray="578.05" stroke-dashoffset="127"/>
          <g class="ticks"></g>
        </svg>
        <div class="gcenter">
          <div class="score" data-countup style="font-size:64px;color:var(--good)">78</div>
          <div class="gradelbl" style="color:var(--good)">良好</div>
          <div class="gsub">Agent 体验分</div>
        </div>
      </div>
      <p class="verdict">日常够用——<b style="color:var(--good)">对话流畅</b>，大文件上传偶尔要多等一会儿。</p>
      <div class="tiles">
        <div class="tile"><div class="tv" style="color:var(--exc)">23<span style="font-size:11px">ms</span></div><div class="tk">响应速度</div><div class="tg" style="color:var(--exc)">优</div></div>
        <div class="tile"><div class="tv" style="color:var(--exc)">0</div><div class="tk">卡顿次数</div><div class="tg" style="color:var(--exc)">优</div></div>
        <div class="tile"><div class="tv" style="color:var(--fair)">4.1</div><div class="tk">上传 Mbps</div><div class="tg" style="color:var(--fair)">可</div></div>
      </div>
    </div>

    <div class="chrome-bot">
      <div class="btnrow">
        <div class="btn ghost press">查看详细数据</div>
        <div class="btn primary press">分享成绩</div>
      </div>
    </div>
    <div class="homebar"></div>
  </div></div>
  <div class="caption"><span class="pill light">亮色模式</span><span class="cap">同一套设计，<b>跟随系统深浅色</b></span></div>
</div></div>
<script src="aneb.js"></script>
