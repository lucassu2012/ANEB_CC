<!-- @dsCard group="屏幕 Screens" name="结果 · 普通用户" subtitle="大分数 + 结论 + 三瓦片" width="360" height="720" -->
<link rel="stylesheet" href="../tokens.css">
<div class="wrap" style="padding:24px;display:flex;justify-content:center">
<div class="framewrap">
  <div class="phone"><div class="screen">
    <div class="notch"></div>
    <div class="chrome-top">
      <div class="sbar"><span>14:35</span><span class="net"><span>电信 5G</span><span class="sig" style="color:var(--exc)"><i></i><i></i><i></i><i></i></span></span></div>
      <div class="brandrow"><div class="wordmark"><div class="w">测试结果</div><div class="sub">电信 5G SA · 深圳 · 刚刚</div></div>
        <div class="modeseg"><span class="on press">简洁</span><span class="press">专业</span></div></div>
    </div>

    <div class="appbody" style="padding-top:108px;padding-bottom:96px">
      <div class="gauge" data-gauge="89" color="var(--exc)" style="margin-top:4px;color:var(--aink)">
        <svg width="208" height="208" viewBox="0 0 212 212" aria-hidden="true">
          <circle cx="106" cy="106" r="92" fill="none" stroke="var(--ahair)" stroke-width="4"/>
          <circle class="arc" cx="106" cy="106" r="92" fill="none" stroke="var(--exc)" stroke-width="10" stroke-linecap="round" stroke-dasharray="578.05" stroke-dashoffset="64"/>
          <g class="ticks"></g>
        </svg>
        <div class="gcenter">
          <div class="score" data-countup style="font-size:64px;color:var(--exc)">89</div>
          <div class="gradelbl" style="color:var(--exc)">优秀</div>
          <div class="gsub">Agent 体验分</div>
        </div>
      </div>
      <p class="verdict">你的网络<b style="color:var(--exc)">很适合 AI 助手</b>——响应快、几乎不卡顿，编码和长对话都能跟上。</p>
      <div class="tiles">
        <div class="tile"><div class="tv" style="color:var(--exc)">35<span style="font-size:11px">ms</span></div><div class="tk">响应速度</div><div class="tg" style="color:var(--exc)">优</div></div>
        <div class="tile"><div class="tv" style="color:var(--exc)">0</div><div class="tk">卡顿次数</div><div class="tg" style="color:var(--exc)">优</div></div>
        <div class="tile"><div class="tv" style="color:var(--good)">12.5</div><div class="tk">上传 Mbps</div><div class="tg" style="color:var(--good)">良</div></div>
      </div>
    </div>

    <div class="chrome-bot">
      <div class="btnrow">
        <div class="btn ghost press">查看详细数据</div>
        <div class="btn primary press">分享成绩</div>
      </div>
    </div>
    <div class="homebar"></div>
  </div></div>
  <div class="caption"><span class="pill simple">结果 · 普通</span><span class="cap">大分数 + <b>一句人话</b> + 三个瓦片</span></div>
</div></div>
<script src="aneb.js"></script>
