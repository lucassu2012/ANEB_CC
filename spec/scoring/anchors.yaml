# ANEB spec — KPI 门限锚点表(机器可读化导出)
# 来源(逐字导出): app/probe/src/main/java/com/aneb/probe/scoring/AqsScorer.kt
#   门限数字来自 KPI 文档 5.2(agent-qoe-kpi v0.1/v0.2,实验性);补全锚点为实现内定义
#   (优/良=85、良/可=70、可/差=55;低者优补 0→100 与 3×可差→0;高者优 U1/D1 见各表)。
# 语义: points = [KPI 值, 分数] 对,按值严格升序;点间线性插值;越界 clamp 到端点分。
# direction: lower_better(值越低分越高)/ higher_better(值越高分越高)。
# 表名与 AqsScorer 字段名去 "_ANCHORS" 后缀一一对应(对拍单测按此映射)。
# 对拍守护: SpecScoringParityTest —— 锚点逐点 + 相邻中点插值 + 越界 clamp 三重对拍。
schema_version: "1.0.0"
kpi_set_version: "agent-qoe-kpi-v0.1"
anchors:
  T1:
    # TTFT 首字响应
    unit: ms
    direction: lower_better
    points:
      - [0.0, 100.0]
      - [200.0, 85.0]
      - [500.0, 70.0]
      - [1000.0, 55.0]
      - [3000.0, 0.0]
  T2:
    # ITL P95(合帧组内只保留组首间隔的主口径)
    unit: ms
    direction: lower_better
    points:
      - [0.0, 100.0]
      - [100.0, 85.0]
      - [200.0, 70.0]
      - [400.0, 55.0]
      - [1200.0, 0.0]
  T3:
    # 卡顿率(不含 resume_latency 主口径)
    unit: ratio
    direction: lower_better
    points:
      - [0.0, 100.0]
      - [0.005, 85.0]
      - [0.02, 70.0]
      - [0.05, 55.0]
      - [0.15, 0.0]
  N1:
    # RTT P50
    unit: ms
    direction: lower_better
    points:
      - [0.0, 100.0]
      - [30.0, 85.0]
      - [60.0, 70.0]
      - [100.0, 55.0]
      - [300.0, 0.0]
  N2:
    # RTT 抖动
    unit: ms
    direction: lower_better
    points:
      - [0.0, 100.0]
      - [10.0, 85.0]
      - [30.0, 70.0]
      - [80.0, 55.0]
      - [240.0, 0.0]
  U2:
    # 工具循环 P95
    unit: ms
    direction: lower_better
    points:
      - [0.0, 100.0]
      - [150.0, 85.0]
      - [300.0, 70.0]
      - [600.0, 55.0]
      - [1800.0, 0.0]
  U1:
    # 上行 goodput(含慢启动主口径,2xx 有效);高者优:0→0,可/差=1→55,良/可=5→70,优/良=20→85,100→100
    unit: Mbps
    direction: higher_better
    points:
      - [0.0, 0.0]
      - [1.0, 55.0]
      - [5.0, 70.0]
      - [20.0, 85.0]
      - [100.0, 100.0]
  D1:
    # 下行 goodput(PROFILE_FRAMEWORK §2.3/§5,结构同 U1;返回下行略高于上行+蜂窝下行利好,锚点整体高于 U1)
    unit: Mbps
    direction: higher_better
    points:
      - [0.0, 0.0]
      - [2.0, 55.0]
      - [8.0, 70.0]
      - [25.0, 85.0]
      - [100.0, 100.0]
  C1:
    # 会话中断率(agent-qoe-kpi v0.2 阶段二 C 组)
    unit: ratio
    direction: lower_better
    points:
      - [0.0, 100.0]
      - [0.005, 85.0]
      - [0.02, 70.0]
      - [0.05, 55.0]
      - [0.15, 0.0]
  C2:
    # 切换恢复时间(恢复失败按 R-10 记 null → KPI_MISSING:C2,绝不以封顶值顶替)
    unit: ms
    direction: lower_better
    points:
      - [0.0, 100.0]
      - [1000.0, 85.0]
      - [3000.0, 70.0]
      - [10000.0, 55.0]
      - [30000.0, 0.0]
  M1:
    # 口到耳(语音,§4.1 对话自然度红线;v1=预算合成 DERIVED / v2=实测代理 PROXY 同锚)
    unit: ms
    direction: lower_better
    points:
      - [0.0, 100.0]
      - [150.0, 85.0]
      - [300.0, 70.0]
      - [400.0, 55.0]
      - [1200.0, 0.0]
  M_FRAME_JITTER:
    # 帧间抖动(kpi_ids: M2,M3 共用):帧到达间隔对名义 20ms 节奏的偏差 P95
    # 与 N2 数值同但语义独立(非 RTT 分位差),单列防口径漂移
    unit: ms
    direction: lower_better
    points:
      - [0.0, 100.0]
      - [10.0, 85.0]
      - [30.0, 70.0]
      - [80.0, 55.0]
      - [240.0, 0.0]
  M4_TTFB:
    # TTS-TTFB(D-38;语音首响远严于 token TTFT——对话自然度)
    unit: ms
    direction: lower_better
    points:
      - [0.0, 100.0]
      - [100.0, 85.0]
      - [250.0, 70.0]
      - [500.0, 55.0]
      - [1500.0, 0.0]
  M5_TURN_SWITCH:
    # 轮次切换(D-38)
    unit: ms
    direction: lower_better
    points:
      - [0.0, 100.0]
      - [150.0, 85.0]
      - [300.0, 70.0]
      - [600.0, 55.0]
      - [2000.0, 0.0]
  M6_STOP:
    # 打断停帧(D-38;55 分档=默认 expected_stop_within_ms=250)
    unit: ms
    direction: lower_better
    points:
      - [0.0, 100.0]
      - [80.0, 85.0]
      - [150.0, 70.0]
      - [250.0, 55.0]
      - [1000.0, 0.0]
  M7_MAX_GAP:
    # 最长帧间静默(D-390 §5.6 订正后的首选判据;提案 VOICE_STALL_KPI_PROPOSAL §3)。
    # 判据是 max 不是分位数——这是它存在的全部理由:M2 用 P95,而 P95 把「罕见但致命」
    # 的长冻结整个丢掉(实测一次 4.55 秒冻结在 599 个间隔里只占 0.67%,落在分位点之上被
    # 切掉,于是 M2 报 25.000ms 的饱和平台,读者拿不到「4.5 秒」这个数)。
    # 门限出处,不发明新数字:
    #   60  = VoiceRunner.CODEC_JB_BUDGET_MS(名义抖动缓冲深度;低于它缓冲吸收得掉)
    #   150 = PROFILE_FRAMEWORK §4.1 口到耳 <150/300/400ms 对话自然度红线的第一档
    #   400 = 同上第三档,亦即 vetoes.yaml 的 M1_VETO_THRESHOLD_MS
    #   1000 = **PROVISIONAL**——五个门限里唯一没有仓内出处的数(裁定 A:保留 1000 而
    #          不改用 400 作末点,因为 400 末点会让 500ms 与 5s 同分(都 0),丢掉「严重度
    #          可传导」这个 M7 存在的全部意义;400→1000 斜坡保留重伤区分度)。
    #          **第一批真实语音语料出来后必须回核此锚**,与规格 §7 的回核义务同一条:
    #          谁跑首批语音谁触发。全仓零语音语料,今天判不了它对真实分布合不合适。
    unit: ms
    direction: lower_better
    points:
      - [0.0, 100.0]
      - [60.0, 85.0]
      - [150.0, 70.0]
      - [400.0, 40.0]
      - [1000.0, 0.0]
