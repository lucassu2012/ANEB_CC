# ANEB spec — AQS 权重表(机器可读化导出;spec 为单一事实源的治理面)
# 来源(逐字导出): app/probe/src/main/java/com/aneb/probe/scoring/AqsScorer.kt
# 对拍守护: app/probe/src/test/java/com/aneb/probe/spec/SpecScoringParityTest.kt
#   —— 任何一侧改动而另一侧未跟进即红。本轮代码不反向引用本文件(导出+对拍,终态为代码引用 spec)。
# 格式约束(受控 YAML 子集,勿超出): 2 空格缩进;整行注释;标量 key: value。
# 每表 Σ 权重 = 1.0(对拍单测守护)。
schema_version: "1.0.0"
tables:
  WEIGHTS:
    # aqs v0.1 主表(KPI 文档 5.4 MVP 权重)
    version_id: "aqs-v0.1"
    weights:
      T1: 0.20
      T3: 0.20
      T2: 0.15
      U1: 0.15
      U2: 0.10
      N1: 0.10
      N2: 0.10
  WEIGHTS_V02:
    # aqs v0.2(阶段二):由 WEIGHTS 全项 ×0.8 + C1 0.10 + C2 0.10 推导
    # (代码内单一事实源即该推导式;本表为推导结果的展开,对拍取 1e-9 容差)
    version_id: "aqs-v0.2"
    weights:
      T1: 0.16
      T3: 0.16
      T2: 0.12
      U1: 0.12
      U2: 0.08
      N1: 0.08
      N2: 0.08
      C1: 0.10
      C2: 0.10
  WEIGHTS_TOKEN_MM:
    # Token 体验·多模态(PROFILE_FRAMEWORK §2.5):抬升上下行(U1+D1=0.30)与 TTFT,压低 tool_loop
    version_id: "aqs-token-v0.1"
    weights:
      T1: 0.18
      T3: 0.15
      T2: 0.12
      U1: 0.15
      D1: 0.15
      U2: 0.05
      N1: 0.10
      N2: 0.10
  WEIGHTS_TOKEN_TXT:
    # Token 体验·纯文本(PROFILE_FRAMEWORK §2.5):U1/D1 为设计缺省不入表(INV-4),
    # 与"测量失败(value=null)→KPI_MISSING"严格区分
    version_id: "aqs-token-v0.1"
    weights:
      T1: 0.25
      T3: 0.22
      T2: 0.18
      U2: 0.05
      N1: 0.15
      N2: 0.15
  WEIGHTS_VOICE:
    # 语音实时交互 v1 观测口径(PROFILE_FRAMEWORK §4.1):向 M 组+抖动倾斜,无吞吐加权项
    # M1=口到耳预算(DERIVED);M2=下行帧间抖动 P95;M3=上行帧间抖动(服务端 chunk_us 权威)
    version_id: "aqs-voice-v0.1"
    weights:
      M1: 0.30
      M2: 0.20
      M3: 0.15
      N1: 0.15
      N2: 0.20
  WEIGHTS_VOICE_V02:
    # 语音 v0.2(D-390 §5.6 / 提案 §4):在 v0.1 基础上加 M7=最长帧间静默 max。
    #
    # **为什么是并列而不是把 WEIGHTS_VOICE 原地改成 v0.2**:spec/README.md §3
    # 「已发布权重表只增不改不删,语义变化=新 id 并列」(先例 aqs-v0.1→WEIGHTS_V02)。
    # 原地改会让语料里已盖 aqsVersion="aqs-voice-v0.1" 的历史分数在 spec 里查无此表
    # ——版本戳指向一个不存在的定义,而重算历史分正是盖这个戳的全部理由。
    #
    # 0.10 从哪来:**只从 M2(0.20→0.15)与 M3(0.15→0.10)出**,M1/N1/N2 一分未动。
    # 理由是这两项与 M7 量的是同一件事的两个尾巴(M2 是下行帧间间隔的 P95,M7 是同一串
    # 间隔的 max),稀释它们=把「同一现象」的权重重新分配,而不是从别的现象身上抢。
    # 反过来,若从 M1(口到耳)或 N 组(网络)扣,等于用「静默变重要了」论证「时延变
    # 次要了」,那是两件事——**这条推理就是 v0.2 与 v0.1 的全部差异,写在这里以便推翻它。**
    version_id: "aqs-voice-v0.2"
    weights:
      M1: 0.30
      M2: 0.15
      M3: 0.10
      M7: 0.10
      N1: 0.15
      N2: 0.20
  WEIGHTS_VOICE_SIM:
    # 语音 v2 server-sim 口径(D-38,/realtime-sim 实测):M1=口到耳实测代理 P50、
    # M2=下行纯传输抖动 P95(sched_us 剥离)、M3=上行帧抖动(paced-proxy 并列)、
    # M4=TTS-TTFB P50(剥服务端驻留)、M5=轮次切换 P50、M6=打断停帧 max
    version_id: "aqs-voice-sim-v0.1"
    weights:
      M1: 0.20
      M2: 0.15
      M3: 0.10
      M4: 0.15
      M5: 0.10
      M6: 0.10
      N1: 0.10
      N2: 0.10
  WEIGHTS_VOICE_SIM_V02:
    # 语音 sim v0.2:在 WEIGHTS_VOICE_SIM 基础上加 M7(并列理由同 WEIGHTS_VOICE_V02)。
    #
    # M7 在 sim 口径里只拿 0.05(v1 口径的一半),因为这里已有 M6=打断停帧 max 在管
    # 「最坏的一次卡」的一部分:两者不同源(M6 是打断后的收敛,M7 是任意时刻的静默),
    # 但读者拿到的是同一类信号,给满权重会把「卡」在总分里数两遍。
    # 0.05 同样从 M2(0.15→0.12)与 M3(0.10→0.08)出,理由同上。
    version_id: "aqs-voice-sim-v0.2"
    weights:
      M1: 0.20
      M2: 0.12
      M3: 0.08
      M4: 0.15
      M5: 0.10
      M6: 0.10
      M7: 0.05
      N1: 0.10
      N2: 0.10
