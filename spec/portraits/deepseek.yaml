# ANEB spec — Profile 3 业务画像占位:DeepSeek App(首批 App 拍板 D-48;SYSTEM_DEV_PLAN §4.3/§5.1 Profile 3)
#
# ⚠️ 红线:画像采集完成前不得用于模拟参数宣称。
#   本文件全部参数为 [GUESS]/null 占位;source_portrait = "PENDING-CAPTURE" 即机器可判的
#   "未采集"标记——任何消费方读到该值必须拒绝将参数用于"模拟真实业务"的对外表述。
#
# capture_plan(计划 §4.3 业务画像采集,M3 里程碑):
#   1. PCAPdroid(免 root)自有设备抓包:包时序/大小/方向/SNI/目的 IP → 拟合节奏与大小分布;
#   2. mitmproxy 解密自有账号流量(若未做证书锁定)→ 真实 token 时序;
#      证书锁定则退化为包时序/大小分析(精度足够拟合节奏参数,风险清单第 3 条);
#   3. 提取:请求大小分布 / token 间隔分布 / 思考静默时长 / 工具调用节奏 / 会话时长 → 拟合为 Profile 参数;
#   4. 副产品:真实入云 PoP/IP 清单(规划归因直接可用)。
# 回填后:source_portrait 改为可追溯采集标识(如 deepseek-app-capture-2026Q3)并升版本。
schema_version: "1.0.0"
app_id: deepseek
display_name: "DeepSeek App"
source_portrait: "PENDING-CAPTURE"
params:
  # 以下全部 [GUESS]/null —— 待画像采集回填(M3);null 语义=未采集,禁编造初值(R-10 同源纪律)
  # ⚠️ mitm 明文 token 层已尝试并**确认不可得**(D-61,2026-07-18):PCAPdroid+mitm addon(Mitmproxy 11.0.0)
  #   免 root 装 CA 至**用户证书库**(CA 确已成功安装,后经手动清理);对话主连接 chat.deepseek.com HTTPS 443
  #   (活跃 38.5KB,含真实 token 响应)显**闭锁=未解密**,cdn-api-auth.zztfly.com HTTPS 显**错误**;
  #   全 App HTTPS 443 均未解密(仅 DNS 明文)。根因:Android 7+(API24+)默认不信任**用户库** CA + 疑似证书
  #   锁定 → 免 root 软件 mitm 拿不到 token 明文(需 root 装系统库 CA 且 App 无 pinning 方可,本设备/主流 App 不成立)。
  #   **印证计划 §4.3 预判**:证书锁定/信任壁垒 → 退化为包时序/大小分析(已由 observed_network_layer 采得)。
  #   token_interval/think_pause 等仍 PENDING(靠 UI 层 cadence 代理 + 网络层字节量级近似,非明文直采)。
  request_size_bytes_dist: null
  token_interval_ms_dist: null
  think_pause_ms_dist: null
  tool_loop_cadence: null
  session_duration_s_dist: null
  downlink_media_bytes_dist: null
  pop_ip_list: null

# -- params_fit_approx (D-62; methodology: PARAMS_FIT_METHODOLOGY.md) --
# WARN: approximate / non-simulation-grade; does NOT unlock params gate
#   (source_portrait stays PENDING-CAPTURE, params all null).
#   keep_pending=true fields must not be used for distribution/simulation claims.
#   caliber in {direct, order-of-magnitude, ui-proxy, none}.
params_fit_approx:
  gates_params: false
  source_portrait_unlocked: false
  fields:
    request_size_bytes_dist:
      value: "~13.8KB/轮(量级锚点,mitm 活跃 38.5KB;请求+响应聚合,未拆上行,非分布)"
      caliber: order-of-magnitude
      keep_pending: true
      source_layer: network
      confidence: LOW
      note: "aggregate order-of-magnitude, not a distribution"
    token_interval_ms_dist:
      value: "PENDING(mitm 无明文 token;UI cadence null,Compose 同帧合流 p50≈0–0.4ms 为渲染节奏≠网络ITL)"
      caliber: none
      keep_pending: true
      source_layer: none
      confidence: NONE
      note: "no same-layer source (PENDING)"
    think_pause_ms_dist:
      value: "PENDING(TTFT 500–1234ms 为 UI 首字延迟含渲染,非推理停顿)"
      caliber: none
      keep_pending: true
      source_layer: none
      confidence: NONE
      note: "no same-layer source (PENDING)"
    tool_loop_cadence:
      value: "PENDING(三层均无工具循环观测)"
      caliber: none
      keep_pending: true
      source_layer: none
      confidence: NONE
      note: "no same-layer source (PENDING)"
    session_duration_s_dist:
      value: "PENDING(events_longreply=810 为 UI 事件计数≠时长口径)"
      caliber: none
      keep_pending: true
      source_layer: none
      confidence: NONE
      note: "no same-layer source (PENDING)"
    downlink_media_bytes_dist:
      value: "PENDING(仅文本流式响应~13.8KB/轮,无媒体下行观测;不得以文本字节冒充媒体)"
      caliber: none
      keep_pending: true
      source_layer: none
      confidence: NONE
      note: "no same-layer source (PENDING)"
    pop_ip_list:
      value: "已修正 OVERCLAIM→keep_pending=true:SNI 端点保留为网络层 direct 证据(自有 chat.deepseek.com/hif-dliq.deepseek.com;zztfly CDN cdn-api-auth/cfgc;火山 apmplus/gator.volces.com),但仅采到 SNI 主机名未解析 IP,待 DNS 解析出原始 IP 再脱 PENDING"
      caliber: direct
      keep_pending: true
      source_layer: network
      confidence: LOW
      note: "direct network-layer fact"


# ── observed_ui_layer(D-55 无障碍观察实测)──────────────────────────────────
# ⚠️ 口径分层:本段=无障碍事件观察的 UI 呈现层代理(含 App 渲染),与上段网络/token 层
#   params 严格分标(计划铁律 3 / D 红线),不可互标、不可互填;恒 LOW/INCONCLUSIVE。
#   网络层 params 仍 PENDING-CAPTURE(需 PCAPdroid 抓包);本段仅证 UI 呈现层已采。
observed_ui_layer:
  captured: true
  source: "aneb-a11y-observe-2026-07-18"    # 无障碍观察(ADAPTER_OBS/adapter_obs 落库),非抓包
  ui_stack: "compose"                        # 自绘 Compose(思考期播放生成动画 → v3 簇分割失效,需 v4)
  ttft_ui_ms: "500–1234"                     # 端到端 TTFT 代理,随问题复杂度：简单 QUIC/TLS 短问答 ~500ms(v4 density);
                                             #   复杂 OSI 七层长问答 ~1234ms(思考更久,更有代表性,D-60)
  ttft_method: "v3-cluster + v4-density"     # 长回复(events 810)下 v3 簇分割也检出(cluster 1234/density 1100 接近互证);
                                             #   短问答(events ~200)时 v3=null 仅 v4 出值——**回复长度影响检测质量**
  cadence_ui_ms: null                        # 同帧突发合流(事件 p50≈0.0–0.4ms),非逐帧节奏,不作 cadence 宣称
  caliber: "UI 呈现口径,含 App 渲染,≠网络 ITL/TTFT;与 Profile 2 服务端仿真严格分标;恒 LOW/INCONCLUSIVE"
  runs: "P40/5G,DeepSeek 快速模式免费档,2026-07-18(D-55 短问答 + D-60 长回复 id=6)"

# ── observed_network_layer(D-57 PCAPdroid 抓包实测；网络传输层，部分）─────────
# ⚠️ 本次抓包窗口未对 DeepSeek 发消息（仅豆包发），故仅采到**背景连接**（APM/DNS），
#   对话主连接未捕获 → dialog_channel PENDING（下次抓包时发消息补）；口径分层同 doubao.yaml。
observed_network_layer:
  captured: "full"                              # 对话主连接已采（D-59 补采：抓包时发消息）
  source: "aneb-pcapdroid-capture-2026-07-18"
  cloud: "自有 deepseek.com + 火山引擎 volces.com（字节体系，APM/监控）"
  dialog_channel: "HTTPS 443（chat.deepseek.com）"
  endpoints:                                    # 真实入云 SNI
    - "chat.deepseek.com（对话主通道，HTTPS 单轮 ~13.8KB / mitm 抓包活跃 38.5KB）"
    - "cdn-api-auth.zztfly.com（CDN/鉴权端点，HTTPS ~12KB；mitm 显错误=疑似 pinning，D-61 发现）"
    - "cfgc.zztfly.com（配置下发端点，HTTPS ~13.4KB，D-61 发现）"
    - "hif-dliq.deepseek.com（DeepSeek 自有子域）"
    - "apmplus.volces.com（火山 APM 上报，~7.9KB）"
    - "gator.volces.com（火山监控/日志，~15KB）"
  dialog_bytes_order: "单轮对话 ~13.8KB（chat.deepseek.com，HTTPS，含 TLS 开销）"
  caliber: "网络传输层(SNI/字节);TLS 加密无明文 token;拓扑+量级;恒 LOW/INCONCLUSIVE"
  runs: "P40/WiFi,抓包 2026-07-18(D-57 背景 + D-59 对话主)"
