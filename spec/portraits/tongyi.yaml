# ANEB spec — Profile 3 业务画像:通义千问(画像扩采第 3 App,D-56;SYSTEM_DEV_PLAN §4.3/§5.1）
#
# ⚠️ 红线:网络层 params 采集完成前不得用于模拟参数宣称。
#   params 段全 [GUESS]/null 占位;source_portrait = "PENDING-CAPTURE"（网络层未采）。
#   observed_ui_layer 段=已采的 UI 呈现层实测（无障碍观察，非抓包），与网络层严格分标。
#
# capture_plan（网络层，M3）：同 doubao.yaml——PCAPdroid 抓包 → 请求大小/token 间隔/思考静默
#   /会话时长分布 + 真实入云 PoP/IP；回填后 source_portrait 改可追溯标识并升版本。
schema_version: "1.0.0"
app_id: tongyi
display_name: "通义千问"
source_portrait: "PENDING-CAPTURE"
params:
  # 网络/token 层——全 [GUESS]/null，待画像采集回填（M3）；null=未采集，禁编造（R-10）
  request_size_bytes_dist: null
  token_interval_ms_dist: null
  think_pause_ms_dist: null
  tool_loop_cadence: null
  session_duration_s_dist: null
  downlink_media_bytes_dist: null
  pop_ip_list: null

# ── params_capture_status（D-348：spine-3 方案 B 逐字段门控；PO 2026-07-31 批复）────
# 逐字段采集态，取代“单串 source_portrait 一翻全翻”：哪个字段采够样本就翻哪个。
#   PENDING            = 尚未采到，**阻塞** source_portrait 翻转（本方法学够得到，只是没采）
#   PENDING-BY-CALIBER = 现红线外才够得到（需 root mitm，D-24/D-61），据此不采；**不阻塞**翻转
#   N/A-BY-CALIBER     = 本方法学口径上永不可得；**不阻塞**翻转
#   CAPTURED           = 已采到真分布，params 同字段方可非 null（R1/R19c 双向咬合）
# 翻门判据 = 无 PENDING 字段剩余（check_redline 的 gate_state 逐画像打印）。
params_capture_status:
  request_size_bytes_dist:
    status: PENDING
    reason: "需 per-direction 上行字节隔离 + 完整流式响应体 + ≥30 turns/≥5 sessions×≥2 网络（蓝图 §5 C2）。**候替代维度语料喂格（D-595）**：通道 D 免解密读方向字节可脱『上下行混算』那层聚合，但 per-request 边界免解密下不可得——只能给窗口级／会话级上行量，不是 per-request 分布，喂格时须显式声明该限定；本条不翻门、不改判定。⚠ kimi 不同：其加密聚合连方向切分都不可得，已按 D-595 转 N/A-BY-CALIBER 终态"
  token_interval_ms_dist:
    status: PENDING-BY-CALIBER
    reason: "明文 token 时间戳仅 root mitm 可得（D-61 免 root 已证不可得），越 D-24 红线故不采；UI cadence 是 ui-proxy≠网络 ITL，禁跨层回填"
  think_pause_ms_dist:
    status: PENDING-BY-CALIBER
    reason: "流内思考停顿与端到端 TTFT 的区分需明文流式 token 时间戳，同 token_interval 的红线外条件"
  tool_loop_cadence:
    status: N/A-BY-CALIBER
    reason: "四者皆消费聊天 App，无工具编排——本方法学口径上永不可得（非“尚未采”）"
  session_duration_s_dist:
    status: N/A-BY-CALIBER
    reason: "终态（D-595）：会话边界是 App 内事件，本方法学观察面（网络＋UI）不产生该语义；唯一近路『per-turn／UI 事件计数换算』被方法学明文禁止（PARAMS_FIT_METHODOLOGY §PENDING gaps/判据 2）。替代维度（多 App×多网络形态）改的是网络条件与 App 覆盖面，与该语义正交——加多少采集都不会长出会话起止事件。同 tool_loop_cadence 形状"
  downlink_media_bytes_dist:
    status: PENDING
    reason: "需真媒体场景 + 端点级字节隔离；禁文本下行冒充媒体（R15 永久红线）。**候替代维度语料喂格（D-595）**：多 App×多网络形态室内维度可给『端点级』字节（真媒体场景由操作者构造＋通道 D 免解密读方向字节），但那是端点级不是内容级——喂格时须显式声明该限定，不得当满格；本条不翻门、不改判定"
  pop_ip_list:
    status: PENDING
    reason: "fit 段已有直采 IP，但 params 门要求跨 ≥2 网络条件的稳定 POP 集合与证据回链复核（蓝图 §1.2/§5 C1）。**候替代维度语料喂格（D-595）**：本格是四格中最对口的一个——DNS 本就明文可得（D-61）、不依赖解密，而『多网络形态』正是该门要求的跨 ≥2 网络条件；本条不翻门、不改判定"

# -- params_fit_approx (D-62; methodology: PARAMS_FIT_METHODOLOGY.md) --
# WARN: approximate / non-simulation-grade; does NOT unlock params gate
#   (source_portrait stays PENDING-CAPTURE, params all null).
#   keep_pending=true fields must not be used for distribution/simulation claims.
#   caliber in {direct, order-of-magnitude, ui-proxy, none}.
params_fit_approx:
  gates_params: false
  source_portrait_unlocked: false
  fields:
    request_size_bytes_dist:
      value: "PENDING(网络层有混合对话字节 ~0.3–1.8KB 弱信号但请求+响应混合、未含完整流式体、量级偏小,保守保持 PENDING)"
      caliber: none
      keep_pending: true
      source_layer: none
      confidence: INCONCLUSIVE
      note: "no same-layer source (PENDING)"
    token_interval_ms_dist:
      value: "~66ms(UI cadence,ui-proxy,显式≠网络ITL;WebView 栈)"
      caliber: ui-proxy
      keep_pending: true
      source_layer: ui
      confidence: LOW
      note: "UI cadence proxy, not network ITL"
    think_pause_ms_dist:
      value: "PENDING(TTFT=1203ms 为端到端首字代理、cadence=66ms 为渲染节奏,均非思考停顿同层观测)"
      caliber: none
      keep_pending: true
      source_layer: none
      confidence: INCONCLUSIVE
      note: "no same-layer source (PENDING)"
    tool_loop_cadence:
      value: "PENDING(消费 App,三口径无工具循环证据)"
      caliber: none
      keep_pending: true
      source_layer: none
      confidence: INCONCLUSIVE
      note: "no same-layer source (PENDING)"
    session_duration_s_dist:
      value: "PENDING(无会话时长采样;a11y 按前台包切换分段非时长分布)"
      caliber: none
      keep_pending: true
      source_layer: none
      confidence: INCONCLUSIVE
      note: "no same-layer source (PENDING)"
    downlink_media_bytes_dist:
      value: "PENDING(无下行媒体字节采样,dialog_bytes_order 量级偏小且未含完整流式体)"
      caliber: none
      keep_pending: true
      source_layer: none
      confidence: INCONCLUSIVE
      note: "no same-layer source (PENDING)"
    pop_ip_list:
      value: "tongyi 双 POP 结构 P40 双网实测(2026-07-19 D-75):ucdc.upaas.quark.cn → **203.119.245.68(阿里云,WiFi+5G 双网同 IP=稳定入云 POP)**;unpm-upaas.quark.cn(经 powerlb.zblb.uc123.com UC 负载均衡)→ 110.253.191.12(WiFi)/123.180.156.65(5G)**随网轮换**。稳定 ucdc POP 支撑 keep_pending=false;前会话记录的 110.253.191.12/114.250.44.6 系 WiFi 侧 LB 边缘非稳定 POP(已修正过度自信)。"
      caliber: direct
      keep_pending: false
      source_layer: network
      confidence: LOW
      note: "direct network-layer fact; stable POP=ucdc 203.119.245.68 (WiFi+5G); powerlb edge rotates"


# ── observed_ui_layer(D-56 无障碍观察实测)──────────────────────────────────
# ⚠️ 口径分层:本段=无障碍事件观察的 UI 呈现层代理(含 App 渲染),与上段网络/token 层
#   params 严格分标(计划铁律 3 / D 红线),不可互标、不可互填;恒 LOW/INCONCLUSIVE。
observed_ui_layer:
  captured: true
  source: "aneb-a11y-observe-2026-07-18"    # 无障碍观察(ADAPTER_OBS/adapter_obs 落库),非抓包
  ui_stack: "webview"                        # UC WebView 内核(com.ucpro.BrowserActivity)——第三种栈
  ttft_ui_ms: 1203                           # 端到端 TTFT 代理;v3 簇分割 1203 与 v4 密度谱 1200 两法互证一致
  ttft_method: "v3-cluster+v4-density(互证)"
  cadence_ui_ms: 66                          # 流式呈现节奏 p50(WebView 栈,介于 View 100ms/Compose 同帧之间)
  caliber: "UI 呈现口径,含 App 渲染,≠网络 ITL/TTFT;与 Profile 2 服务端仿真严格分标;恒 LOW/INCONCLUSIVE"
  runs: "P40/5G,千问免费档,2026-07-18(D-56)"

# ── observed_network_layer(D-57 PCAPdroid 抓包实测；网络传输层）─────────────
# ⚠️ 口径分层同 doubao.yaml：TLS 加密无明文 token;仅采入云拓扑/IP/字节量级。
observed_network_layer:
  captured: "partial"                           # 采到 HTTPS/TLS 到 quark.cn + 实测 IP;对话主连接量级偏小
  source: "aneb-pcapdroid-capture-2026-07-18"
  cloud: "阿里 / UC 夸克 upaas.quark.cn"
  dialog_channel: "HTTPS/TLS 443"
  endpoints:
    - "unpm-upaas.quark.cn → powerlb UC LB（HTTPS，~1.8KB；POP 随网轮换 WiFi 110.253.191.12/5G 123.180.156.65，D-75）"
    - "ucdc.upaas.quark.cn → 203.119.245.68（阿里云 ucdc-upaas.uc.cn，TLS；WiFi+5G 双网同 IP 稳定，D-75）"
  dest_ips:                                      # 真实入云 IP（PoP，归因直接可用）
    - "110.253.191.12"
    - "114.250.44.6"
  dialog_bytes_order: "采样连接 ~0.3–1.8KB（未含完整流式响应体，量级偏小）"
  caliber: "网络传输层(SNI/IP/字节);TLS 加密无明文 token;拓扑+IP 采到,分布未完整拟合;恒 LOW/INCONCLUSIVE"
  runs: "P40/WiFi,抓包 2026-07-18(D-57)"
