# ANEB spec — Profile 3 业务画像:通义千问(画像扩采第 3 App,D-56;SYSTEM_DEV_PLAN §4.3/§5.1）
#
# ⚠️ 红线:网络层 params 采集完成前不得用于模拟参数宣称。
#   params 段全 [GUESS]/null 占位;source_portrait = "PENDING-CAPTURE"（网络层未采）。
#   observed_ui_layer 段=已采的 UI 呈现层实测（无障碍观察，非抓包），与网络层严格分标。
#
# capture_plan（网络层，M3）：同 doubao.yaml——PCAPdroid 抓包 → 请求大小/token 间隔/思考静默
#   /会话时长分布 + 真实入云 PoP/IP；回填后 source_portrait 改可追溯标识并升版本。
schema_version: "1.0.0"
app_id: tongyi
display_name: "通义千问"
source_portrait: "PENDING-CAPTURE"
params:
  # 网络/token 层——全 [GUESS]/null，待画像采集回填（M3）；null=未采集，禁编造（R-10）
  request_size_bytes_dist: null
  token_interval_ms_dist: null
  think_pause_ms_dist: null
  tool_loop_cadence: null
  session_duration_s_dist: null
  downlink_media_bytes_dist: null
  pop_ip_list: null

# -- params_fit_approx (D-62; methodology: PARAMS_FIT_METHODOLOGY.md) --
# WARN: approximate / non-simulation-grade; does NOT unlock params gate
#   (source_portrait stays PENDING-CAPTURE, params all null).
#   keep_pending=true fields must not be used for distribution/simulation claims.
#   caliber in {direct, order-of-magnitude, ui-proxy, none}.
params_fit_approx:
  gates_params: false
  source_portrait_unlocked: false
  fields:
    request_size_bytes_dist:
      value: "PENDING(网络层有混合对话字节 ~0.3–1.8KB 弱信号但请求+响应混合、未含完整流式体、量级偏小,保守保持 PENDING)"
      caliber: none
      keep_pending: true
      source_layer: none
      confidence: INCONCLUSIVE
      note: "no same-layer source (PENDING)"
    token_interval_ms_dist:
      value: "~66ms(UI cadence,ui-proxy,显式≠网络ITL;WebView 栈)"
      caliber: ui-proxy
      keep_pending: true
      source_layer: ui
      confidence: LOW
      note: "UI cadence proxy, not network ITL"
    think_pause_ms_dist:
      value: "PENDING(TTFT=1203ms 为端到端首字代理、cadence=66ms 为渲染节奏,均非思考停顿同层观测)"
      caliber: none
      keep_pending: true
      source_layer: none
      confidence: INCONCLUSIVE
      note: "no same-layer source (PENDING)"
    tool_loop_cadence:
      value: "PENDING(消费 App,三口径无工具循环证据)"
      caliber: none
      keep_pending: true
      source_layer: none
      confidence: INCONCLUSIVE
      note: "no same-layer source (PENDING)"
    session_duration_s_dist:
      value: "PENDING(无会话时长采样;a11y 按前台包切换分段非时长分布)"
      caliber: none
      keep_pending: true
      source_layer: none
      confidence: INCONCLUSIVE
      note: "no same-layer source (PENDING)"
    downlink_media_bytes_dist:
      value: "PENDING(无下行媒体字节采样,dialog_bytes_order 量级偏小且未含完整流式体)"
      caliber: none
      keep_pending: true
      source_layer: none
      confidence: INCONCLUSIVE
      note: "no same-layer source (PENDING)"
    pop_ip_list:
      value: "110.253.191.12, 114.250.44.6(阿里·UC夸克 upaas.quark.cn,HTTPS 443;真实入云 PoP,归因直接可用)——唯一 IP 级完整落值字段"
      caliber: direct
      keep_pending: false
      source_layer: network
      confidence: LOW
      note: "direct network-layer fact"


# ── observed_ui_layer(D-56 无障碍观察实测)──────────────────────────────────
# ⚠️ 口径分层:本段=无障碍事件观察的 UI 呈现层代理(含 App 渲染),与上段网络/token 层
#   params 严格分标(计划铁律 3 / D 红线),不可互标、不可互填;恒 LOW/INCONCLUSIVE。
observed_ui_layer:
  captured: true
  source: "aneb-a11y-observe-2026-07-18"    # 无障碍观察(ADAPTER_OBS/adapter_obs 落库),非抓包
  ui_stack: "webview"                        # UC WebView 内核(com.ucpro.BrowserActivity)——第三种栈
  ttft_ui_ms: 1203                           # 端到端 TTFT 代理;v3 簇分割 1203 与 v4 密度谱 1200 两法互证一致
  ttft_method: "v3-cluster+v4-density(互证)"
  cadence_ui_ms: 66                          # 流式呈现节奏 p50(WebView 栈,介于 View 100ms/Compose 同帧之间)
  caliber: "UI 呈现口径,含 App 渲染,≠网络 ITL/TTFT;与 Profile 2 服务端仿真严格分标;恒 LOW/INCONCLUSIVE"
  runs: "P40/5G,千问免费档,2026-07-18(D-56)"

# ── observed_network_layer(D-57 PCAPdroid 抓包实测；网络传输层）─────────────
# ⚠️ 口径分层同 doubao.yaml：TLS 加密无明文 token;仅采入云拓扑/IP/字节量级。
