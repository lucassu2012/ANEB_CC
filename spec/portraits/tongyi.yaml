  captured: "partial"                           # 采到 HTTPS/TLS 到 quark.cn + 实测 IP;对话主连接量级偏小
  source: "aneb-pcapdroid-capture-2026-07-18"
  cloud: "阿里 / UC 夸克 upaas.quark.cn"
  dialog_channel: "HTTPS/TLS 443"
  endpoints:
    - "unpm-upaas.quark.cn（HTTPS，~1.8KB）"
    - "ucdc.upaas.quark.cn（TLS）"
  dest_ips:                                      # 真实入云 IP（PoP，归因直接可用）
    - "110.253.191.12"
    - "114.250.44.6"
  dialog_bytes_order: "采样连接 ~0.3–1.8KB（未含完整流式响应体，量级偏小）"
  caliber: "网络传输层(SNI/IP/字节);TLS 加密无明文 token;拓扑+IP 采到,分布未完整拟合;恒 LOW/INCONCLUSIVE"
  runs: "P40/WiFi,抓包 2026-07-18(D-57)"
