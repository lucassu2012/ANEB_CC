# ANEB spec — Profile 3 业务画像:Kimi(画像扩采第 4 App,D-56;SYSTEM_DEV_PLAN §4.3/§5.1）
#
# ⚠️ 红线:网络层 params 采集完成前不得用于模拟参数宣称。
#   params 段全 [GUESS]/null 占位;source_portrait = "PENDING-CAPTURE"（网络层未采）。
#
# ⚠️ observed_ui_layer.captured = false —— **UI 呈现层观察方法对本 App 不适配**（诚实记录）：
#   Kimi K2.6 复杂 Compose UI 事件流结构使三种 TTFT 方法均不可靠（D-56 真机实证）：
#     - v1 input-clear 锚点武装但 ttft_send=33.5ms（=气泡上屏延迟，非响应首字）；
#     - v3 簇分割 ttft_cluster=54558ms（54s，事件流跨度错配脏值，已被 30s 合理性上界抑制为 null）；
#     - v4 密度谱 ttft_density=null（同帧突发合流，无可辨密度跃变）。
#   结论:无障碍事件测 TTFT 非万能——依赖 App 事件流结构;Kimi 待 v5 方法或改抓包口径。
#   诚实缺席优于错值（R-10）：不填任何 UI 层 TTFT 数值。
#
# capture_plan（网络层，M3）：同 doubao.yaml——PCAPdroid 抓包（Kimi 网络层画像仍可采，
#   与 UI 层观察不适配无关）。
schema_version: "1.0.0"
app_id: kimi
display_name: "Kimi"
source_portrait: "PENDING-CAPTURE"
params:
  # 网络/token 层——全 [GUESS]/null，待画像采集回填（M3）；null=未采集，禁编造（R-10）
  request_size_bytes_dist: null
  token_interval_ms_dist: null
  think_pause_ms_dist: null
  tool_loop_cadence: null
  session_duration_s_dist: null
  downlink_media_bytes_dist: null
  pop_ip_list: null

# -- params_fit_approx (D-62; methodology: PARAMS_FIT_METHODOLOGY.md) --
# WARN: approximate / non-simulation-grade; does NOT unlock params gate
#   (source_portrait stays PENDING-CAPTURE, params all null).
#   keep_pending=true fields must not be used for distribution/simulation claims.
#   caliber in {direct, order-of-magnitude, ui-proxy, none}.
params_fit_approx:
  gates_params: false
  source_portrait_unlocked: false
  fields:
    request_size_bytes_dist:
      value: "PENDING(网络仅捕获连接形态:7003 非标长连+jpush,加密聚合 TCP 不可切分为 per-request;k2.7 编程 API 属 API 口径不可借)"
      caliber: none
      keep_pending: true
      source_layer: none
      confidence: INCONCLUSIVE
      note: "no same-layer source (PENDING)"
    token_interval_ms_dist:
      value: "PENDING(API ITL 259ms 属 Kimi Code k2.7 编程产品+API 明文口径,跨产品+跨口径双重越界禁借;D-61 无明文直采;UI 三法 null)"
      caliber: none
      keep_pending: true
      source_layer: none
      confidence: INCONCLUSIVE
      note: "no same-layer source (PENDING)"
    think_pause_ms_dist:
      value: "PENDING(ttft 3063ms/强制思考主导属 k2.7 编程 API,跨产品跨口径不可借;UI null)"
      caliber: none
      keep_pending: true
      source_layer: none
      confidence: INCONCLUSIVE
      note: "no same-layer source (PENDING)"
    tool_loop_cadence:
      value: "PENDING(UI/网络/API 三口径无工具循环同口径观测)"
      caliber: none
      keep_pending: true
      source_layer: none
      confidence: INCONCLUSIVE
      note: "no same-layer source (PENDING)"
    session_duration_s_dist:
      value: "PENDING(长连端点存在≠会话时长可测,无直采时长源)"
      caliber: none
      keep_pending: true
      source_layer: none
      confidence: INCONCLUSIVE
      note: "no same-layer source (PENDING)"
    downlink_media_bytes_dist:
      value: "PENDING(加密非标长连+jpush 混杂,聚合字节无法区分下行媒体 vs 控制字节)"
      caliber: none
      keep_pending: true
      source_layer: none
      confidence: INCONCLUSIVE
      note: "no same-layer source (PENDING)"
    pop_ip_list:
      value: "121.37.172.191:7003(自有 IM 非标准 TCP 长连端点,华为云广州段;n=1)——'自有IM/广州段'为 ASN/地理轻推断标注,IP:port 本身直采;建议标注待多点复采确认"
      caliber: direct
      keep_pending: false
      source_layer: network
      confidence: LOW
      note: "direct network-layer fact"


# ── observed_ui_layer(D-56：方法不适配，诚实 false)──────────────────────────
observed_ui_layer:
  captured: false                            # 三种 TTFT 方法均不适配（见文件头注）；UI 层未得可信画像
  source: "aneb-a11y-observe-2026-07-18(不适配)"
  ui_stack: "compose"                        # 原生 MainActivity + 复杂 Compose（同帧合流，事件 p50≈0.4ms）
  ttft_ui_ms: null                           # 不可靠→null（R-10 诚实缺席，绝不填 54558 脏值）
  ttft_method: "none-applicable"
  cadence_ui_ms: null
  caliber: "方法边界：无障碍事件测 TTFT 依赖 App 事件流结构，Kimi 复杂 UI 不适配；待 v5 或抓包"
  runs: "P40/5G,Kimi 会员账户,2026-07-18(D-56)"

# ── observed_network_layer(D-57 PCAPdroid 抓包实测；网络传输层，部分）─────────
# ⚠️ 本次抓包窗口未对 Kimi 发消息（仅豆包发），故仅采到**背景连接**（推送/DNS），
#   对话主连接未捕获 → dialog_channel PENDING（下次抓包时发消息补）；口径分层同 doubao.yaml。
observed_network_layer:
  captured: "full"                              # 对话/IM 长连已采（D-59 补采：抓包时发消息）
  source: "aneb-pcapdroid-capture-2026-07-18"
  cloud: "自有 IM（TCP 7003 长连）+ 极光推送 jpush（第三方 push）+ easytomessage.com"
  dialog_channel: "**TCP 7003 自定义端口长连**（非标准 HTTPS/443）→ 121.37.172.191"
  # ⚠️ 架构差异（4 App 对比）：Kimi 对话走**非标准 TCP 7003 端口长连**，而豆包=WebSocket(wss)、
  #   DeepSeek/千问=HTTPS 443——Kimi 是四者中唯一用自定义端口的（疑似自有 IM 协议长连）。
  endpoints:
    - "TCP 7003 → 121.37.172.191（对话/IM 主通道候选，非标准端口长连；字节量级抓包窗口未完整确认）"
    - "sis.jpush.io / sis-ipv6.jpush.cn / s.jpush.cn（极光推送 DNS/长连）"
    - "UDP 19000 → jpush（推送长连）"
    - "easytomessage.com（自有 IM 相关）"
  dialog_bytes_order: null                       # TCP 7003 字节量级抓包窗口被 UI 遮挡未确认，待补
  caliber: "网络传输层(SNI/IP/端口);对话走非标准 TCP 端口(架构差异发现);字节待确认;恒 LOW/INCONCLUSIVE"
  runs: "P40/WiFi,抓包 2026-07-18(D-57 背景 + D-59 对话/IM 长连)"
