# ANEB spec — Profile 3 业务画像占位:豆包(首批 App 拍板 D-48;SYSTEM_DEV_PLAN §4.3/§5.1 Profile 3)
#
# ⚠️ 红线:画像采集完成前不得用于模拟参数宣称。
#   本文件全部参数为 [GUESS]/null 占位;source_portrait = "PENDING-CAPTURE" 即机器可判的
#   "未采集"标记——任何消费方读到该值必须拒绝将参数用于"模拟真实业务"的对外表述。
#
# capture_plan(计划 §4.3 业务画像采集,M3 里程碑):
#   1. PCAPdroid(免 root)自有设备抓包:包时序/大小/方向/SNI/目的 IP → 拟合节奏与大小分布;
#   2. mitmproxy 解密自有账号流量(若未做证书锁定)→ 真实 token 时序;
#      证书锁定则退化为包时序/大小分析(精度足够拟合节奏参数,风险清单第 3 条);
#   3. 提取:请求大小分布 / token 间隔分布 / 思考静默时长 / 工具调用节奏 / 会话时长 → 拟合为 Profile 参数;
#   4. 副产品:真实入云 PoP/IP 清单(规划归因直接可用)。
# 回填后:source_portrait 改为可追溯采集标识(如 doubao-app-capture-2026Q3)并升版本。
schema_version: "1.0.0"
app_id: doubao
display_name: "豆包"
source_portrait: "PENDING-CAPTURE"
params:
  # 以下全部 [GUESS]/null —— 待画像采集回填(M3);null 语义=未采集,禁编造初值(R-10 同源纪律)
  request_size_bytes_dist: null
  token_interval_ms_dist: null
  think_pause_ms_dist: null
  tool_loop_cadence: null
  session_duration_s_dist: null
  downlink_media_bytes_dist: null
  pop_ip_list: null

# -- params_fit_approx (D-62; methodology: PARAMS_FIT_METHODOLOGY.md) --
# WARN: approximate / non-simulation-grade; does NOT unlock params gate
#   (source_portrait stays PENDING-CAPTURE, params all null).
#   keep_pending=true fields must not be used for distribution/simulation claims.
#   caliber in {direct, order-of-magnitude, ui-proxy, none}.
params_fit_approx:
  gates_params: false
  source_portrait_unlocked: false
  fields:
    request_size_bytes_dist:
      value: "~10–18KB/turn(量级锚点;上下行合计,未隔离纯请求/上行;非分布)"
      caliber: order-of-magnitude
      keep_pending: true
      source_layer: network
      confidence: LOW
      note: "aggregate order-of-magnitude, not a distribution"
    token_interval_ms_dist:
      value: "~100ms(UI cadence,ui-proxy,显式≠网络ITL)"
      caliber: ui-proxy
      keep_pending: true
      source_layer: ui
      confidence: LOW
      note: "UI cadence proxy, not network ITL"
    think_pause_ms_dist:
      value: "PENDING(无明文 token 时序;TTFT 1984ms 为首token前整体UI时延含网络+服务端,非流内思考停顿)"
      caliber: none
      keep_pending: true
      source_layer: none
      confidence: NONE
      note: "no same-layer source (PENDING)"
    tool_loop_cadence:
      value: "PENDING(消费对话 App,无 tool-loop 观测)"
      caliber: none
      keep_pending: true
      source_layer: none
      confidence: NONE
      note: "no same-layer source (PENDING)"
    session_duration_s_dist:
      value: "PENDING(仅采 per-turn 时序,无会话时长观测)"
      caliber: none
      keep_pending: true
      source_layer: none
      confidence: NONE
      note: "no same-layer source (PENDING)"
    downlink_media_bytes_dist:
      value: "PENDING(已修正 OVERCLAIM:观测下行~17.6KB 为文本流式非媒体,本次媒体实测=0;frontier5 audio-ws-lq 未做字节隔离。不得以文本下行冒充媒体)"
      caliber: none
      keep_pending: true
      source_layer: none
      confidence: NONE
      note: "no same-layer source (PENDING)"
    pop_ip_list:
      value: "wss100.doubao.com / api5.doubao.com / frontier5.doubao.com / log.doubao.com(4 SNI 端点,自有 doubao.com 基础设施;当前为 SNI 主机名级,具体 POP IP 解析待补)"
      caliber: direct
      keep_pending: true
      source_layer: network
      confidence: LOW
      note: "direct network-layer fact"


# ── observed_ui_layer(D-52/D-54 无障碍观察实测)──────────────────────────────
# ⚠️ 口径分层:本段=无障碍事件观察的 UI 呈现层代理(含 App 渲染),与上段网络/token 层
#   params 严格分标(计划铁律 3 / D 红线),不可互标、不可互填;恒 LOW/INCONCLUSIVE。
#   网络层 params 仍 PENDING-CAPTURE(需 PCAPdroid 抓包);本段仅证 UI 呈现层已采。
observed_ui_layer:
  captured: true
  source: "aneb-a11y-observe-2026-07-18"    # 无障碍观察(ADAPTER_OBS/adapter_obs 落库),非抓包
  ui_stack: "view"                           # 原生 View 系(思考期 UI 静止 → v3 簇分割适用)
  ttft_ui_ms: 1984                           # 端到端 TTFT 代理(发送→响应首字,含渲染)
  ttft_method: "v3-cluster"
  cadence_ui_ms: 100                         # 流式呈现节奏 p50(累计 8 轮 99.7–111.6ms 稳定)
  caliber: "UI 呈现口径,含 App 渲染,≠网络 ITL/TTFT;与 Profile 2 服务端仿真严格分标;恒 LOW/INCONCLUSIVE"
  runs: "P40/5G,豆包免费档,2026-07-18(D-52/D-54)"

# ── observed_network_layer(D-57 PCAPdroid 抓包实测；网络传输层）─────────────
# ⚠️ 口径分层:本段=网络传输层观察(SNI/目的域名/端口/字节量级)。TLS 加密下**无明文 token
#   时序**——params 的 token_interval/think_pause 仍 PENDING(需 mitm 解密或保持 UI 层)。
#   与 observed_ui_layer / params 三层并列、严格分标。source_portrait 仍 PENDING-CAPTURE
#   (仅采到入云拓扑+字节量级,未做完整分布拟合)。
observed_network_layer:
  captured: "full"                             # 抓包时发消息→对话主连接完整捕获
  source: "aneb-pcapdroid-capture-2026-07-18"
  cloud: "字节自有 *.doubao.com"
  dialog_channel: "WebSocket(wss) + HTTPS API" # 对话主通道:实测走 WebSocket + HTTPS
  endpoints:                                    # 真实入云 SNI(PoP)
    - "wss100-normal-lq.doubao.com（对话 WebSocket，单轮 ~17.6KB）"
    - "api5-normal-hl.doubao.com（对话 API，~9.8KB）"
    - "frontier5-audio-ws-lq.doubao.com（音频 WebSocket，实时语音链路）"
    - "log.doubao.com（日志上报）"
  dialog_bytes_order: "单轮对话 ~10–18KB（上下行合计，含 TLS 开销）"
  caliber: "网络传输层(SNI/IP/字节);TLS 加密无明文 token;拓扑+量级非精确分布拟合;恒 LOW/INCONCLUSIVE"
  runs: "P40/WiFi,抓包 2026-07-18(D-57)"
