# ANEB spec — Profile 3 业务画像占位:豆包(首批 App 拍板 D-48;SYSTEM_DEV_PLAN §4.3/§5.1 Profile 3)
#
# ⚠️ 红线:画像采集完成前不得用于模拟参数宣称。
#   本文件全部参数为 [GUESS]/null 占位;source_portrait = "PENDING-CAPTURE" 即机器可判的
#   "未采集"标记——任何消费方读到该值必须拒绝将参数用于"模拟真实业务"的对外表述。
#
# capture_plan(计划 §4.3 业务画像采集,M3 里程碑):
#   1. PCAPdroid(免 root)自有设备抓包:包时序/大小/方向/SNI/目的 IP → 拟合节奏与大小分布;
#   2. mitmproxy 解密自有账号流量(若未做证书锁定)→ 真实 token 时序;
#      证书锁定则退化为包时序/大小分析(精度足够拟合节奏参数,风险清单第 3 条);
#   3. 提取:请求大小分布 / token 间隔分布 / 思考静默时长 / 工具调用节奏 / 会话时长 → 拟合为 Profile 参数;
#   4. 副产品:真实入云 PoP/IP 清单(规划归因直接可用)。
# 回填后:source_portrait 改为可追溯采集标识(如 doubao-app-capture-2026Q3)并升版本。
schema_version: "1.0.0"
app_id: doubao
display_name: "豆包"
source_portrait: "PENDING-CAPTURE"
params:
  # 以下全部 [GUESS]/null —— 待画像采集回填(M3);null 语义=未采集,禁编造初值(R-10 同源纪律)
  request_size_bytes_dist: null
  token_interval_ms_dist: null
  think_pause_ms_dist: null
  tool_loop_cadence: null
  session_duration_s_dist: null
  downlink_media_bytes_dist: null
  pop_ip_list: null

# ── params_capture_status（D-348：spine-3 方案 B 逐字段门控；PO 2026-07-31 批复）────
# 逐字段采集态，取代“单串 source_portrait 一翻全翻”：哪个字段采够样本就翻哪个。
#   PENDING            = 尚未采到，**阻塞** source_portrait 翻转（本方法学够得到，只是没采）
#   PENDING-BY-CALIBER = 现红线外才够得到（需 root mitm，D-24/D-61），据此不采；**不阻塞**翻转
#   N/A-BY-CALIBER     = 本方法学口径上永不可得；**不阻塞**翻转
#   CAPTURED           = 已采到真分布，params 同字段方可非 null（R1/R19c 双向咬合）
# 翻门判据 = 无 PENDING 字段剩余（check_redline 的 gate_state 逐画像打印）。
params_capture_status:
  request_size_bytes_dist:
    status: PENDING
    reason: "需 per-direction 上行字节隔离 + 完整流式响应体 + ≥30 turns/≥5 sessions×≥2 网络（蓝图 §5 C2）"
  token_interval_ms_dist:
    status: PENDING-BY-CALIBER
    reason: "明文 token 时间戳仅 root mitm 可得（D-61 免 root 已证不可得），越 D-24 红线故不采；UI cadence 是 ui-proxy≠网络 ITL，禁跨层回填"
  think_pause_ms_dist:
    status: PENDING-BY-CALIBER
    reason: "流内思考停顿与端到端 TTFT 的区分需明文流式 token 时间戳，同 token_interval 的红线外条件"
  tool_loop_cadence:
    status: N/A-BY-CALIBER
    reason: "四者皆消费聊天 App，无工具编排——本方法学口径上永不可得（非“尚未采”）"
  session_duration_s_dist:
    status: PENDING
    reason: "需 a11y 会话开始/结束埋点（非 per-turn 换算），代码未落地（蓝图 §5 C6）"
  downlink_media_bytes_dist:
    status: PENDING
    reason: "需真媒体场景 + 端点级字节隔离；禁文本下行冒充媒体（R15 永久红线）"
  pop_ip_list:
    status: PENDING
    reason: "fit 段已有直采 IP，但 params 门要求跨 ≥2 网络条件的稳定 POP 集合与证据回链复核（蓝图 §1.2/§5 C1）"

# -- params_fit_approx (D-62; methodology: PARAMS_FIT_METHODOLOGY.md) --
# WARN: approximate / non-simulation-grade; does NOT unlock params gate
#   (source_portrait stays PENDING-CAPTURE, params all null).
#   keep_pending=true fields must not be used for distribution/simulation claims.
#   caliber in {direct, order-of-magnitude, ui-proxy, none}.
params_fit_approx:
  gates_params: false
  source_portrait_unlocked: false
  fields:
    request_size_bytes_dist:
      value: "~10–18KB/turn 量级锚点 + P40 抓包 per-direction 观测(2026-07-19 D-76,PCAPdroid app_filter):对话 gateway api5-eeft-gateway-hl.feishu.cn→123.6.180.112 的 2 轮连接总量=下 146.8KB/上 25.0KB(下行为主,流式响应)。连接级 HTTP/2 复用,非 per-turn 分布→保持量级锚点(要 per-turn 分布需 ≥30turns 多会话)。"
      caliber: order-of-magnitude
      keep_pending: true
      source_layer: network
      confidence: LOW
      note: "aggregate order-of-magnitude, not a distribution; per-direction observed down 146.8/up 25.0 KB (2 turns)"
    token_interval_ms_dist:
      value: "~100ms(UI cadence,ui-proxy,显式≠网络ITL)"
      caliber: ui-proxy
      keep_pending: true
      source_layer: ui
      confidence: LOW
      note: "UI cadence proxy, not network ITL"
    think_pause_ms_dist:
      value: "PENDING(无明文 token 时序;TTFT 1984ms 为首token前整体UI时延含网络+服务端,非流内思考停顿)"
      caliber: none
      keep_pending: true
      source_layer: none
      confidence: INCONCLUSIVE
      note: "no same-layer source (PENDING)"
    tool_loop_cadence:
      value: "PENDING(消费对话 App,无 tool-loop 观测)"
      caliber: none
      keep_pending: true
      source_layer: none
      confidence: INCONCLUSIVE
      note: "no same-layer source (PENDING)"
    session_duration_s_dist:
      value: "PENDING(仅采 per-turn 时序,无会话时长观测)"
      caliber: none
      keep_pending: true
      source_layer: none
      confidence: INCONCLUSIVE
      note: "no same-layer source (PENDING)"
    downlink_media_bytes_dist:
      value: "PENDING(已修正 OVERCLAIM:观测下行~17.6KB 为文本流式非媒体,本次媒体实测=0;frontier5 audio-ws-lq 未做字节隔离。不得以文本下行冒充媒体)"
      caliber: none
      keep_pending: true
      source_layer: none
      confidence: INCONCLUSIVE
      note: "no same-layer source (PENDING)"
    pop_ip_list:
      value: "4 SNI 端点 P40 双网解析实测(2026-07-19 D-73):wss100-normal-lq→direct.frontier-doubao-broker-v4.lq.bytelb.net(字节自有 LB;WiFi 121.30.176.241/5G 113.24.210.217 随网轮换)、api5-normal-hl/frontier5-audio-ws→cdnbuild.net CDN(WiFi 123.6.52.x/5G 171.15.110.x 轮换)、log→cdngslb(42.234.124.87/1.194.30.103 轮换)。POP 跨网轮换=anycast/CDN 边缘非固定入云 IP,记录观测 IP 但保持 PENDING(无稳定 POP,区别于 deepseek 双网稳定 WAF IP)"
      caliber: direct
      keep_pending: true
      source_layer: network
      confidence: LOW
      note: "direct network-layer fact; POP rotates across WiFi/5G (CDN/anycast)"


# ── observed_ui_layer(D-52/D-54 无障碍观察实测)──────────────────────────────
# ⚠️ 口径分层:本段=无障碍事件观察的 UI 呈现层代理(含 App 渲染),与上段网络/token 层
#   params 严格分标(计划铁律 3 / D 红线),不可互标、不可互填;恒 LOW/INCONCLUSIVE。
#   网络层 params 仍 PENDING-CAPTURE(需 PCAPdroid 抓包);本段仅证 UI 呈现层已采。
observed_ui_layer:
  captured: true
  source: "aneb-a11y-observe-2026-07-18"    # 无障碍观察(ADAPTER_OBS/adapter_obs 落库),非抓包
  ui_stack: "view"                           # 原生 View 系(思考期 UI 静止 → v3 簇分割适用)
  ttft_ui_ms: 1984                           # 端到端 TTFT 代理(A0′ 用户气泡上屏→响应首字,含渲染)
  # ⚠ 起点订正(D-396 / 大脑裁定 6-6 前半,2026-08-01):本行原写「发送→响应首字」,
  #   而 v3 簇分割的实际起点是**首簇首事件=用户气泡上屏**(D-52 逐字:三段结构
  #   「用户气泡上屏簇→思考静默→流式响应簇」,ttftClusterMs=首簇起→次簇起),
  #   即 `spec/adapters/INSTRUMENTATION_SPEC.md` §1.2 命名的 A0′,不是发送动作 A0。
  #   两者相差「点击→气泡上屏」这一**从未测量过**的量;该量由实验 E3 测出前,
  #   本值不得被读作「用户按下发送到看见首字」。数值本身未变,只订正它自称测的是什么。
  ttft_method: "v3-cluster"
  cadence_ui_ms: 100                         # 流式呈现节奏 p50(累计 8 轮 99.7–111.6ms 稳定)
  caliber: "UI 呈现口径,含 App 渲染,≠网络 ITL/TTFT;与 Profile 2 服务端仿真严格分标;恒 LOW/INCONCLUSIVE"
  runs: "P40/5G,豆包免费档,2026-07-18(D-52/D-54)"
  # ── dist 子段(additive,大脑裁定 6-7 批准;规格见 INSTRUMENTATION_SPEC §4.5)──────
  # **本画像刻意不写 dist 段**——这是它今天的诚实状态,不是遗漏。
  # 上面的 ttft_ui_ms 1984 来自两次一致的读数(1984.4 / 1984.6,D-52/D-54);两次一致是
  # 好信号,但**两次不是分布**。蓝图 §1.2 的证据阶梯要求 ≥30 turns / ≥5 sessions /
  # ≥2 网络条件,并给出 p50/p90/p99 + 样本数 + 采集环境。没到阈值就整段不写,
  # 而不是写一个 n=3 的"分布"——写下来它就会在下游被当成 p99 引用。
  # 采到之后的形状(check_redline R20 逐条钉死:段可缺席,一旦出现字段不得为 null):
  #   dist:
  #     ttft_ui_ms:    { p50: , p90: , p99: , n: , sessions: , networks: [] }
  #     cadence_ui_ms: { p50: , p90: , p99: , n: , sessions: , networks: [] }
  #     rct_ui_ms:     { p50: , p90: , p99: , n: , sessions: , networks: [] }  # 依赖 A4 判据(§1.5)
  #     method: { ttft: , rct: }
  #     captured_at:                       # YYYY-MM-DD

# ── observed_network_layer(D-57 PCAPdroid 抓包实测；网络传输层）─────────────
# ⚠️ 口径分层:本段=网络传输层观察(SNI/目的域名/端口/字节量级)。TLS 加密下**无明文 token
#   时序**——params 的 token_interval/think_pause 仍 PENDING(需 mitm 解密或保持 UI 层)。
#   与 observed_ui_layer / params 三层并列、严格分标。source_portrait 仍 PENDING-CAPTURE
#   (仅采到入云拓扑+字节量级,未做完整分布拟合)。
observed_network_layer:
  captured: "full"                             # 抓包时发消息→对话主连接完整捕获
  source: "aneb-pcapdroid-capture-2026-07-18"
  cloud: "字节生态:SNI *.doubao.com 为前端门面,对话后端实走 feishu.cn(Lark 飞书)/zijieapi.com/snssdk.com(D-76 P40 抓包实测,均字节内网域)"
  dialog_channel: "WebSocket(wss) + HTTPS API" # 对话主通道:实测走 WebSocket + HTTPS
  dialog_gateway_observed: "api5-eeft-gateway-hl.feishu.cn → 123.6.180.112:443(D-76 对话 gateway,下 146.8/上 25.0KB/2 轮);msg-frontier-hl/mcs-bd.feishu.cn(消息前端);life-service-open/keyhub.zijieapi.com(字节 API);mon.snssdk.com(监控)"
  endpoints:                                    # 真实入云 SNI(PoP)
    - "wss100-normal-lq.doubao.com → 字节自有 LB bytelb.net（对话 WebSocket，单轮 ~17.6KB；POP 随网轮换 WiFi 121.30.176.241/5G 113.24.210.217，D-73）"
    - "api5-normal-hl.doubao.com（对话 API，~9.8KB）"
    - "frontier5-audio-ws-lq.doubao.com（音频 WebSocket，实时语音链路）"
    - "log.doubao.com（日志上报）"
  dialog_bytes_order: "单轮对话 ~10–18KB（上下行合计，含 TLS 开销）"
  caliber: "网络传输层(SNI/IP/字节);TLS 加密无明文 token;拓扑+量级非精确分布拟合;恒 LOW/INCONCLUSIVE"
  runs: "P40/WiFi,抓包 2026-07-18(D-57)"
